# Ruff config for the Dustarr plugin repo.
#
# Mirrors the workspace-wide <workspace>\ruff.toml conventions so
# `ruff check .` behaves identically whether run from inside this repo alone
# (as CI does -- it checks out only this repo) or from within the parent
# workspace. Do not remove: without this file, CI falls back to ruff's bare
# defaults (select = E4,E7,E9,F) with no per-file-ignores, and both
# tests/conftest.py's dynamic sys.modules setup and tests/*.py's re-exported
# imports fail the default F401/E402 checks.

target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "B", "UP"]

ignore = [
    "E501",   # line too long
    "E741",   # ambiguous variable name (l/I/O)
    "B008",   # function call in default arg -- common Django/plugin pattern
]

[lint.per-file-ignores]
# Tests stub modules into sys.modules and import dynamically; that legitimately
# trips import-order and unused-import rules.
"**/tests/**" = ["E402", "F401", "F811"]
"**/conftest.py" = ["E402", "F401"]

[format]
quote-style = "double"
indent-style = "space"
